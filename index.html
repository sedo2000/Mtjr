<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>متجر الفواكه والخضار</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- مكتبات فايربيس السحابية -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <style>
    body { font-family: 'Tajawal', sans-serif; background: #f4f6f8; }
  </style>
</head>
<body class="min-h-screen pb-20">

  <header class="bg-white shadow-sm sticky top-0 z-40 px-4 py-3 flex justify-between items-center">
    <div class="flex items-center gap-2">
      <!-- رسومات SVG سلة الفاكهة -->
      <svg class="w-8 h-8" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M6 14L9 26H23L26 14H6Z" fill="#D97706" stroke="#B45309" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M8 18H24M10 22H22" stroke="#B45309" stroke-width="1" stroke-linecap="round"/>
        <path d="M10 14C10 9 12 6 16 6C20 6 22 9 22 14" stroke="#B45309" stroke-width="1.5" stroke-linecap="round"/>
        <circle cx="13" cy="11" r="3.5" fill="#EF4444"/>
        <circle cx="19" cy="10" r="3" fill="#F59E0B"/>
        <circle cx="16" cy="12" r="2.5" fill="#10B981"/>
      </svg>
      <h1 class="font-black text-xl text-emerald-600">سلة الفاكهة</h1>
    </div>
    
    <div id="ownerControlsContainer" class="flex items-center gap-2"></div>
  </header>

  <main class="max-w-md mx-auto p-4">
    <div class="mb-4">
      <input type="text" id="searchInput" placeholder="ابحث في المنتجات..." oninput="filterProducts()" class="w-full p-3 bg-white rounded-xl shadow-sm border border-gray-200 outline-none focus:border-emerald-500 text-sm">
    </div>

    <h2 class="font-black text-base mb-3 text-gray-800">قائمة المنتجات المتوفرة</h2>
    
    <div id="productsGrid" class="grid grid-cols-2 gap-3">
      <p class="col-span-2 text-center text-gray-400 py-10 text-xs">جاري تحميل المنتجات من السحابة...</p>
    </div>
  </main>

  <!-- نافذة تفاصيل المنتج -->
  <div id="productDetailModal" class="fixed inset-0 bg-black/50 z-50 hidden items-center justify-center p-4">
    <div class="bg-white w-full max-w-sm rounded-2xl p-5 relative shadow-2xl">
      <button onclick="closeProductDetail()" class="absolute top-3 left-3 text-gray-400 font-bold text-lg">✕</button>
      <div id="detailContent"></div>
    </div>
  </div>

  <!-- نافذة تسجيل الدخول السري للمالك -->
  <div id="loginModal" class="fixed inset-0 bg-black/50 z-50 hidden items-center justify-center p-4">
    <div class="bg-white w-full max-w-sm rounded-2xl p-6 relative shadow-xl">
      <button onclick="closeLoginModal()" class="absolute top-4 left-4 text-gray-400 font-bold text-lg">✕</button>
      <h3 class="text-lg font-black mb-4 text-center text-gray-800">تسجيل دخول المالك</h3>
      
      <div class="space-y-3">
        <div>
          <label class="text-xs font-bold text-gray-600 block mb-1">البريد الإلكتروني:</label>
          <input type="email" id="loginEmail" placeholder="البريد الإلكتروني" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl text-sm outline-none focus:border-emerald-500">
        </div>
        <div>
          <label class="text-xs font-bold text-gray-600 block mb-1">كلمة المرور:</label>
          <input type="password" id="loginPassword" placeholder="كلمة المرور" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl text-sm outline-none focus:border-emerald-500">
        </div>
        <button onclick="checkAdminLogin()" class="w-full bg-emerald-600 text-white py-3 rounded-xl font-bold text-sm shadow-md mt-2">دخول لوحة التحكم</button>
      </div>
    </div>
  </div>

  <!-- لوحة التحكم السحابية -->
  <div id="adminPanelModal" class="fixed inset-0 bg-black/50 z-50 hidden items-center justify-center p-4">
    <div class="bg-white w-full max-w-lg rounded-2xl p-6 relative max-h-[90vh] overflow-y-auto shadow-2xl">
      <button onclick="toggleAdminPanel()" class="absolute top-4 left-4 text-gray-400 font-bold text-lg">✕</button>
      <h3 class="text-xl font-black mb-4 text-emerald-600 border-b pb-2">لوحة التحكم وإدارة المنتجات السحابية</h3>

      <div class="bg-emerald-50/60 p-4 rounded-xl mb-6 border border-emerald-100">
        <h4 class="font-bold text-sm text-emerald-800 mb-3">➕ إضافة منتج جديد للجميع</h4>
        <div class="space-y-3">
          <input type="text" id="pName" placeholder="اسم المنتج (مثال: تفاح طازج)" class="w-full p-2.5 bg-white border border-gray-200 rounded-lg text-sm outline-none">
          <input type="text" id="pDesc" placeholder="وصف المنتج (مثال: حلو ولذيذ درجة أولى)" class="w-full p-2.5 bg-white border border-gray-200 rounded-lg text-sm outline-none">
          
          <div class="grid grid-cols-2 gap-2">
            <input type="text" id="pPrice" placeholder="السعر (مثال: 2000 د.ع)" class="w-full p-2.5 bg-white border border-gray-200 rounded-lg text-sm outline-none">
            <input type="text" id="pWeight" placeholder="الوزن أو الحجم (مثال: 1 كغ)" class="w-full p-2.5 bg-white border border-gray-200 rounded-lg text-sm outline-none">
          </div>

          <input type="text" id="pUnit" placeholder="وحدة البيع (كيلو / حبة / صندوق)" class="w-full p-2.5 bg-white border border-gray-200 rounded-lg text-sm outline-none">
          
          <div>
            <label class="text-xs font-bold text-gray-600 block mb-1">اختر صورة المنتج من جهازك:</label>
            <input type="file" id="pImageFile" accept="image/*" class="w-full p-2 bg-white border border-gray-200 rounded-lg text-xs text-gray-500 file:mr-4 file:py-1 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100">
          </div>

          <button onclick="addNewProduct()" class="w-full bg-emerald-600 text-white py-2.5 rounded-lg font-bold text-sm shadow">حفظ ورفع المنتج للسحابة</button>
        </div>
      </div>

      <h4 class="font-bold text-sm text-gray-800 mb-2">📦 المنتجات السحابية الحالية</h4>
      <div id="adminProductsList" class="space-y-2"></div>
      
      <div class="mt-6 pt-4 border-t flex justify-end">
        <button onclick="logoutAdmin()" class="bg-red-50 text-red-600 px-4 py-2 rounded-xl text-xs font-bold">تسجيل خروج المدير</button>
      </div>
    </div>
  </div>

  <script>
    // إعدادات فايربيس المباشرة لتعمل بسلاسة على فيرسل
    const firebaseConfig = {
      apiKey: "AIzaSyAKQt1UTGkUsx043cdzeu9qY4hL9f6yU-w",
      authDomain: "sla-fruit.firebaseapp.com",
      projectId: "sla-fruit",
      storageBucket: "sla-fruit.firebasestorage.app",
      messagingSenderId: "49013439224",
      appId: "1:49013439224:web:2537c25a78214f714dd90d"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let products = [];
    let isAdminLoggedIn = localStorage.getItem('is_admin_logged') === 'true';

    window.onload = function() {
      checkSecretAdminAccess();
      updateAuthUI();
      fetchProductsFromCloud();
    };

    function checkSecretAdminAccess() {
      if (window.location.hash === '#admin') {
        if (isAdminLoggedIn) {
          toggleAdminPanel();
        } else {
          openLoginModal();
        }
      }
    }

    function openLoginModal() { 
      const m = document.getElementById('loginModal');
      m.classList.remove('hidden'); m.classList.add('flex'); 
    }
    function closeLoginModal() { 
      const m = document.getElementById('loginModal');
      m.classList.remove('flex'); m.classList.add('hidden'); 
      if(window.location.hash === '#admin') {
        history.pushState("", document.title, window.location.pathname + window.location.search);
      }
    }

    function checkAdminLogin() {
      const emailInput = document.getElementById('loginEmail').value.trim();
      const passInput = document.getElementById('loginPassword').value.trim();

      if (emailInput === 'sydwbydw@gmail.com' && passInput === 'sla@#1234') {
        isAdminLoggedIn = true;
        localStorage.setItem('is_admin_logged', 'true');
        closeLoginModal();
        updateAuthUI();
        toggleAdminPanel();
        alert('مرحباً بك يا مالك المتجر، تم فتح لوحة التحكم بنجاح.');
      } else {
        alert('البيانات غير صحيحة! هذا الحساب مخصص للمالك فقط.');
      }
    }

    function logoutAdmin() {
      isAdminLoggedIn = false;
      localStorage.removeItem('is_admin_logged');
      updateAuthUI();
      toggleAdminPanel();
      history.pushState("", document.title, window.location.pathname + window.location.search);
      alert('تم تسجيل الخروج من لوحة التحكم.');
    }

    function updateAuthUI() {
      const container = document.getElementById('ownerControlsContainer');
      if (isAdminLoggedIn) {
        container.innerHTML = `
          <button onclick="toggleAdminPanel()" class="bg-slate-900 text-white px-3 py-1.5 rounded-xl text-xs font-bold shadow-sm hover:bg-slate-800 transition flex items-center gap-1">
            <span>⚙️</span> لوحة التحكم
          </button>
          <button onclick="logoutAdmin()" class="bg-slate-900 text-white px-3 py-1.5 rounded-xl text-xs font-bold shadow-sm hover:bg-slate-800 transition">
            حساب المالك (متصل)
          </button>
        `;
      } else {
        container.innerHTML = '';
      }
    }

    function toggleAdminPanel() {
      if (!isAdminLoggedIn) {
        openLoginModal();
        return;
      }
      const modal = document.getElementById('adminPanelModal');
      const isHidden = modal.classList.contains('hidden');
      if (isHidden) {
        modal.classList.remove('hidden');
        modal.classList.add('flex');
        renderAdminList();
      } else {
        modal.classList.remove('flex');
        modal.classList.add('hidden');
      }
    }

    function fetchProductsFromCloud() {
      db.collection("products").orderBy("createdAt", "desc").onSnapshot((snapshot) => {
        products = [];
        snapshot.forEach((doc) => {
          products.push({ id: doc.id, ...doc.data() });
        });
        renderStoreProducts(products);
        if(!document.getElementById('adminPanelModal').classList.contains('hidden')) {
          renderAdminList();
        }
      });
    }

    function addNewProduct() {
      const name = document.getElementById('pName').value.trim();
      const desc = document.getElementById('pDesc').value.trim();
      const price = document.getElementById('pPrice').value.trim();
      const weight = document.getElementById('pWeight').value.trim();
      const unit = document.getElementById('pUnit').value.trim();
      const fileInput = document.getElementById('pImageFile');

      if (!name || !price || !unit) {
        alert('يرجى كتابة اسم المنتج، السعر، ووحدة البيع على الأقل.');
        return;
      }

      if (fileInput.files && fileInput.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          saveToCloud(name, desc, price, weight, unit, e.target.result);
        };
        reader.readAsDataURL(fileInput.files[0]);
      } else {
        saveToCloud(name, desc, price, weight, unit, 'https://images.unsplash.com/photo-1618512496248-a07fe83aa8cb?w=400&q=80');
      }
    }

    function saveToCloud(name, desc, price, weight, unit, imageSrc) {
      const newProduct = {
        name,
        desc: desc || 'طازج وعالي الجودة',
        price,
        weight: weight || 'غير محدد',
        unit,
        image: imageSrc,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      };

      db.collection("products").add(newProduct).then(() => {
        document.getElementById('pName').value = '';
        document.getElementById('pDesc').value = '';
        document.getElementById('pPrice').value = '';
        document.getElementById('pWeight').value = '';
        document.getElementById('pUnit').value = '';
        document.getElementById('pImageFile').value = '';
        alert('تمت إضافة المنتج بنجاح ورفعه للسحابة للجميع!');
      }).catch((error) => {
        alert('حدث خطأ أثناء الحفظ: ' + error.message);
      });
    }

    function deleteProduct(id) {
      if (confirm('هل أنت متأكد من حذف هذا المنتج من المتجر للجميع؟')) {
        db.collection("products").doc(id).delete().then(() => {
          alert('تم الحذف بنجاح.');
        }).catch((error) => {
          alert('خطأ في الحذف: ' + error.message);
        });
      }
    }

    function openProductDetail(id) {
      const p = products.find(item => item.id === id);
      if (!p) return;

      const detailContent = document.getElementById('detailContent');
      detailContent.innerHTML = `
        <img src="${p.image}" class="w-full h-40 object-cover rounded-xl mb-3 bg-gray-50">
        <h3 class="font-black text-lg text-gray-800 mb-1">${p.name}</h3>
        <p class="text-xs text-gray-500 mb-3">${p.desc}</p>
        
        <div class="bg-emerald-50 p-3 rounded-xl space-y-2 mb-4 border border-emerald-100">
          <div class="flex justify-between items-center text-sm">
            <span class="text-gray-600 font-medium">السعر:</span>
            <span class="font-black text-emerald-700 text-base">${p.price}</span>
          </div>
          <div class="flex justify-between items-center text-xs">
            <span class="text-gray-600">الوزن / الحجم:</span>
            <span class="font-bold text-gray-800">${p.weight}</span>
          </div>
          <div class="flex justify-between items-center text-xs">
            <span class="text-gray-600">وحدة البيع:</span>
            <span class="font-bold text-gray-800">${p.unit}</span>
          </div>
        </div>

        <button onclick="closeProductDetail(); alert('تمت إضافة المنتج إلى السلة');" class="w-full bg-emerald-600 text-white py-2.5 rounded-xl font-bold text-sm shadow-sm hover:bg-emerald-700 transition">إضافة للسلة +</button>
      `;

      const modal = document.getElementById('productDetailModal');
      modal.classList.remove('hidden'); modal.classList.add('flex');
    }

    function closeProductDetail() {
      const modal = document.getElementById('productDetailModal');
      modal.classList.remove('flex'); modal.classList.add('hidden');
    }

    function renderStoreProducts(listToRender) {
      const grid = document.getElementById('productsGrid');
      
      if (listToRender.length === 0) {
        grid.innerHTML = '<p class="col-span-2 text-center text-gray-400 py-10 text-xs">لا توجد أي منتجات لعرضها حالياً.</p>';
        return;
      }

      grid.innerHTML = listToRender.map(p => `
        <div onclick="openProductDetail('${p.id}')" class="bg-white p-3 rounded-2xl shadow-sm border border-gray-100 flex flex-col justify-between cursor-pointer hover:shadow-md transition">
          <img src="${p.image}" class="w-full h-28 object-cover rounded-xl mb-2 bg-gray-50">
          <div>
            <h3 class="font-bold text-sm text-gray-800">${p.name}</h3>
            <p class="text-xs text-gray-500 mb-2 truncate">${p.desc}</p>
            <div class="flex justify-between items-center mb-2">
              <span class="font-black text-emerald-600 text-xs">${p.price}</span>
              <span class="bg-emerald-50 text-emerald-700 text-[10px] font-bold px-1.5 py-0.5 rounded-md">${p.weight}</span>
            </div>
          </div>
          <button onclick="event.stopPropagation(); openProductDetail('${p.id}')" class="w-full bg-emerald-600 text-white py-1.5 rounded-xl font-bold text-xs shadow-sm hover:bg-emerald-700 transition">عرض التفاصيل</button>
        </div>
      `).join('');
    }

    function filterProducts() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = products.filter(p => p.name.toLowerCase().includes(query) || p.desc.toLowerCase().includes(query));
      renderStoreProducts(filtered);
    }

    function renderAdminList() {
      const list = document.getElementById('adminProductsList');
      
      if (products.length === 0) {
        list.innerHTML = '<p class="text-gray-400 text-xs text-center py-4">لم تقم بإضافة أي منتجات بعد.</p>';
        return;
      }

      list.innerHTML = products.map(p => `
        <div class="flex items-center justify-between bg-gray-50 p-2.5 rounded-xl border border-gray-200">
          <div class="flex items-center gap-3">
            <img src="${p.image}" class="w-10 h-10 object-cover rounded-lg">
            <div>
              <div class="font-bold text-xs text-gray-800">${p.name}</div>
              <div class="text-[10px] text-gray-500">السعر: ${p.price} | الوزن: ${p.weight} (${p.unit})</div>
            </div>
          </div>
          <button onclick="deleteProduct('${p.id}')" class="bg-red-100 text-red-600 px-3 py-1 rounded-lg text-xs font-bold hover:bg-red-200">حذف</button>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
